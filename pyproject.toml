[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "govconapi-mcp"
version = "0.3.1"
description = "MCP server for GovCon API: six task-shaped tools (resolve, search, get, market, price, contact) reaching 53 operations across the federal contracting lifecycle, for Claude Desktop, Claude Code, Cursor, Zed, or any local MCP client."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GovCon API", email = "support@govconapi.com" }]
keywords = ["mcp", "model-context-protocol", "federal-contracts", "sam-gov", "govcon", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://govconapi.com"
Documentation = "https://govconapi.com/api-guide"
Repository = "https://github.com/govconapi/govconapi-mcp"
Issues = "https://github.com/govconapi/govconapi-mcp/issues"

[project.scripts]
govconapi-mcp = "govconapi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["govconapi_mcp"]
